name: "security.txt expiry reminder"

on:
  schedule:
    - cron: "0 9 1 * *" # 09:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  issues: write

env:
  SECURITY_TXT_URL: "https://henriquesantana.work/.well-known/security.txt"
  WARN_DAYS: "60"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check live Expires date and open an issue if close
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const url = process.env.SECURITY_TXT_URL;
            const warnDays = Number(process.env.WARN_DAYS);
            const titlePrefix = "security.txt";

            let problem = null;
            let expires = null;
            try {
              const res = await fetch(url, { headers: { "cache-control": "no-cache" } });
              if (!res.ok) {
                problem = `${url} returned HTTP ${res.status}.`;
              } else {
                const text = await res.text();
                const m = text.match(/^Expires:\s*(\S+)\s*$/mi);
                if (!m || isNaN(Date.parse(m[1]))) {
                  problem = `${url} has no parseable Expires field.`;
                } else {
                  expires = new Date(m[1]);
                }
              }
            } catch (e) {
              problem = `Fetching ${url} failed: ${e.message}`;
            }

            let title, body;
            if (problem) {
              title = `${titlePrefix}: live file check failed`;
              body = `${problem}\n\nRFC 9116 requires the file to be reachable with a valid Expires field.`;
            } else {
              const days = Math.floor((expires - Date.now()) / 86400000);
              const date = expires.toISOString().slice(0, 10);
              core.info(`Live Expires is ${date} (${days} days away).`);
              if (days > warnDays) return;
              title = `${titlePrefix}: expires ${date}, renew now`;
              body = `The live ${url} expires on **${date}** (${days} days from this check).\n\n` +
                     `The file is served by Cloudflare at the edge, not from this repo. Update the Expires field there.`;
            }

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            if (open.some(i => !i.pull_request && i.title.startsWith(titlePrefix))) {
              core.info("An open security.txt issue already exists, skipping.");
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body,
            });
