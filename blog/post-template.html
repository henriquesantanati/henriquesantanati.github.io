<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} | Henrique Santana</title>
  <meta name="description" content="{{DESCRIPTION}}">

  <link rel="canonical" href="https://henriquesantana.work/blog/{{SLUG}}.html" />

  <!-- Open Graph -->
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://henriquesantana.work/blog/{{SLUG}}.html">
  <meta property="og:title" content="{{TITLE}} — Henrique Santana">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:image" content="https://henriquesantana.work/assets/images/og-default.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:alt" content="Henrique Santana — henriquesantana.work">
  <meta property="article:published_time" content="{{DATE_ISO}}">
  <meta property="article:author" content="Henrique Santana">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}} — Henrique Santana">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="https://henriquesantana.work/assets/images/og-default.jpg">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F5F2EC'/%3E%3Crect x='0.5' y='0.5' width='31' height='31' fill='none' stroke='%23B07D3A' stroke-width='1'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' font-style='italic' fill='%231A1814' text-anchor='middle'%3EHS%3C/text%3E%3C/svg%3E">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garant:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">

  <!-- Blog styles -->
  <link rel="stylesheet" href="blog.css">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PGQ6160NZG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-PGQ6160NZG');
  </script>

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": "{{TITLE}}",
    "description": "{{DESCRIPTION}}",
    "datePublished": "{{DATE_ISO}}",
    "author": {
      "@type": "Person",
      "name": "Henrique Santana",
      "url": "https://henriquesantana.work/"
    },
    "publisher": {
      "@type": "Person",
      "name": "Henrique Santana"
    },
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": "https://henriquesantana.work/blog/{{SLUG}}.html"
    }
  }
  </script>
</head>
<body>

  <!-- ── NAV ──────────────────────────────────────────────── -->
  <nav aria-label="Main navigation">
    <div class="nav-inner">
      <a href="/" class="nav-logo">Henrique Santana</a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/blog/" class="active">Blog</a></li>
      </ul>
    </div>
  </nav>

  <!-- ── ARTICLE HEADER ───────────────────────────────────── -->
  <header class="article-header">
    <a href="/blog/" class="back-link reveal">← All posts</a>
    <h1 class="reveal reveal-delay-1">{{TITLE}}</h1>
    <div class="article-meta reveal reveal-delay-2">
      <time datetime="{{DATE_ISO}}">{{DATE_DISPLAY}}</time>
      <span>{{READING_TIME}} min read</span>
    </div>
  </header>

  <!-- ── ARTICLE BODY ─────────────────────────────────────── -->
  <article class="article-body">

    {{CONTENT}}

  </article>

  <!-- ── FOOTER ───────────────────────────────────────────── -->
  <footer>
    <div class="footer-inner">
      <p class="footer-copy">
        <strong>Henrique Santana</strong> · Principal Cloud Support Engineer, AWS
      </p>
    </div>
  </footer>

  <!-- ── SCROLL REVEAL ────────────────────────────────────── -->
  <script>
    (function () {
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
      document.querySelectorAll('.reveal').forEach(function (el) {
        observer.observe(el);
      });
    })();
  </script>

</body>
</html>
